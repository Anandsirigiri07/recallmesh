services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: recallmesh-falkordb
    ports:
      # Bound strictly to localhost loopback (127.0.0.1) for secure local development
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

volumes:
  falkordb_data:
